version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: sach-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: '123456'
      MYSQL_DATABASE: 'sach'
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sach.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sach-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sach-backend
    restart: always
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/sach?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      - db
    networks:
      - sach-network

  frontend:
    build:
      context: ../frontend_hnh
      dockerfile: Dockerfile
    container_name: sach-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ../frontend_hnh:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - sach-network

networks:
  sach-network:
    driver: bridge

volumes:
  db_data:
